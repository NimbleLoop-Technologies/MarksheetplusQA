# Self-contained MarksheetPlus stack for the QA regression suite (CI and local).
# Started by ci/run-regression.sh; do not `docker compose up` this file by hand without the env it exports.
#
# Layout
#   infra   : postgres, mongo, rabbitmq, minio, smtp4dev  (compose network only, nothing published)
#   edge    : Caddy. Owns the network namespace the apps share, terminates TLS (Caddy's own local CA)
#             and publishes the four public ports on 127.0.0.1. Because api/authapp/worker/web/familyapp
#             join this namespace (network_mode: service:edge), https://localhost:<port> means the same
#             thing to the browser on the runner and to the RestApi validating AuthApp tokens.
#   apps    : images built by run-regression.sh from `dotnet publish` output of the MarksheetPlus checkout.
#
# Every credential below is a throwaway value for this stack only (see ci/stack/stack.env and
# docs/qa/CI.md). Per-run secrets (JWT, deployment hook, family-link keys) are generated by the
# entry point into QA_CI_WORK_DIR and never committed.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${QA_CI_PG_USER}
      POSTGRES_PASSWORD: ${QA_CI_PG_PASSWORD}
      POSTGRES_DB: mp-shared-schools-db
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${QA_CI_PG_USER}"]
      interval: 3s
      timeout: 5s
      retries: 40

  mongo:
    image: mongo:8
    # The official image sets GLIBC_TUNABLES=glibc.pthread.rseq=0 so tcmalloc can use rseq.
    # mongod 8.0.21+ then exits 1 on kernels it reads as 6.19 or newer (SERVER-121912), including
    # GitHub-hosted ubuntu-latest (uname -r 7.0.0-azure; Ubuntu keeps that string even when the
    # upstream fix is present, SERVER-136848). rseq=1 leaves per-CPU caches off, which is the
    # startup path that check allows. Do not drop this back to the image default.
    environment:
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    command: ["--wiredTigerCacheSizeGB", "0.5"]
    volumes: ["mongodata:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 3s
      timeout: 10s
      retries: 40
      start_period: 20s

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${QA_CI_RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${QA_CI_RABBIT_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 40

  minio:
    image: ${QA_CI_MINIO_IMAGE:-pgsty/minio:latest}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${QA_CI_MINIO_USER}
      MINIO_ROOT_PASSWORD: ${QA_CI_MINIO_PASSWORD}

  smtp4dev:
    image: rnwood/smtp4dev:latest

  edge:
    image: ${COMPOSE_PROJECT_NAME}-edge:local
    environment:
      API_PORT: ${QA_CI_API_PORT}
      AUTH_PORT: ${QA_CI_AUTH_PORT}
      WEB_PORT: ${QA_CI_WEB_PORT}
      FAMILY_PORT: ${QA_CI_FAMILY_PORT}
      QA_CI_SPREAD_CLIENT_IPS: ${QA_CI_SPREAD_CLIENT_IPS:-true}
    ports:
      - "${QA_CI_BIND_ADDRESS:-127.0.0.1}:${QA_CI_API_PORT}:${QA_CI_API_PORT}"
      - "${QA_CI_BIND_ADDRESS:-127.0.0.1}:${QA_CI_AUTH_PORT}:${QA_CI_AUTH_PORT}"
      - "${QA_CI_BIND_ADDRESS:-127.0.0.1}:${QA_CI_WEB_PORT}:${QA_CI_WEB_PORT}"
      - "${QA_CI_BIND_ADDRESS:-127.0.0.1}:${QA_CI_FAMILY_PORT}:${QA_CI_FAMILY_PORT}"
    volumes: ["caddydata:/data"]

  api:
    image: ${COMPOSE_PROJECT_NAME}-api:local
    network_mode: service:edge
    env_file: ["${QA_CI_WORK_DIR}/env/common.env", "${QA_CI_WORK_DIR}/env/api.env"]
    volumes: ["caddydata:/caddy-data:ro"]
    depends_on:
      edge: { condition: service_started }
      postgres: { condition: service_healthy }
      mongo: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      minio: { condition: service_started }

  authapp:
    image: ${COMPOSE_PROJECT_NAME}-authapp:local
    network_mode: service:edge
    env_file: ["${QA_CI_WORK_DIR}/env/common.env", "${QA_CI_WORK_DIR}/env/authapp.env"]
    volumes: ["caddydata:/caddy-data:ro"]
    depends_on:
      edge: { condition: service_started }
      postgres: { condition: service_healthy }
      mongo: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  worker:
    image: ${COMPOSE_PROJECT_NAME}-worker:local
    network_mode: service:edge
    env_file: ["${QA_CI_WORK_DIR}/env/common.env", "${QA_CI_WORK_DIR}/env/worker.env"]
    volumes: ["caddydata:/caddy-data:ro"]
    depends_on:
      edge: { condition: service_started }
      postgres: { condition: service_healthy }
      mongo: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  web:
    image: ${COMPOSE_PROJECT_NAME}-web:local
    network_mode: service:edge
    depends_on: [edge]

  familyapp:
    image: ${COMPOSE_PROJECT_NAME}-familyapp:local
    network_mode: service:edge
    depends_on: [edge]

volumes:
  pgdata: {}
  mongodata: {}
  caddydata: {}
